<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubFlow - AI Video Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">SubFlow</div>
        <p>AI-Powered Video Editor</p>
    </header>

    <!-- Main Content -->
    <main class="main-container">

        <!-- Upload Section -->
        <section class="upload-section" id="uploadSection">
            <div class="cloud-icon">☁</div>
            <h1>Upload your video</h1>
            <p>Drag & drop your video here or choose a file</p>

            <input type="file" id="videoInput" accept="video/*" hidden>

            <button class="choose-button" id="chooseBtn" type="button">
                Choose Video
            </button>

            <p class="file-name" id="fileName"></p>
        </section>

        <!-- Editor Section -->
        <section class="editor-section" id="editorSection">

            <!-- Video Preview -->
            <div class="video-container">
                <video id="videoPreview" controls></video>
            </div>

            <!-- Timeline Area -->
            <div class="timeline-area">

                <!-- Thumbnails -->
                <div class="thumbnail-container">
                    <div class="thumbnail-strip" id="thumbnailStrip"></div>
                </div>

                <!-- Timeline -->
                <div class="horizontal-timeline">
                    <input type="range" id="fromRange" min="0" max="100" value="0" step="0.1">
                    <input type="range" id="toRange" min="0" max="100" value="100" step="0.1">
                </div>

                <!-- Time Selection -->
                <div class="time-box">
                    <div>
                        <span>FROM</span>
                        <strong id="fromTime">00:00</strong>
                    </div>

                    <div>
                        <span>TO</span>
                        <strong id="toTime">00:00</strong>
                    </div>
                </div>

                <!-- Process Button -->
                <button id="processBtn" class="process-button" type="button">
                    Process Video
                </button>

                <p id="status" class="status"></p>
            </div>

        </section>

        <!-- Result Section -->
        <section class="result-section" id="resultSection">
            <h2>Processed Video</h2>

            <div class="result-video-container">
                <video id="resultVideo" controls></video>
            </div>

            <a id="downloadBtn" class="download-button" download="processed-video.mp4">
                Download Video
            </a>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
